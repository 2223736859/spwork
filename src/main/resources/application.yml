server:
  port: 8090
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/springboot?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
mybatis:
  mapper-locations: classpath:Mapper/*Mapper.xml
  type-aliases-package: com.example.spwork.entity
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    com:
      sac:
        demo:
          mapper : debug

# JWT 配置
jwt:
  # HS256 要求密钥至少 32 字节（256 位），生产环境应使用环境变量注入
  secret: spwork-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
  # 令牌有效期：24 小时（毫秒）
  expiration: 86400000
